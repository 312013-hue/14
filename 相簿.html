        <main>
                <section class="gallery-header">
                    <h2>我的相簿</h2>
                    <p>探索我們精選的視覺饗宴。</p>
                </section>
           <section class="image-gallery">
                    <div class="gallery-grid">
                        <div class="gallery-item">
                            <img src="img/4.jpg" alt="爆豪勝己" data-full="img/4.jpg">
                            <div class="caption">爆豪勝己</div>
                        </div>
                        <div class="gallery-item">
                            <img src="img/5.jpg" alt="轟焦凍" data-full="img/5.jpg">
                            <div class="caption">轟焦凍</div>
                        </div>
                        <div class="gallery-item">
                            <img src="img/6.jpg" alt="飯田天哉" data-full="img/6.jpg">
                            <div class="caption">飯田天哉</div>
                        </div>
                        <div class="gallery-item">
                            <img src="img/7.jpg" alt="歐爾麥特" data-full="img/7.jpg">
                            <div class="caption">歐爾麥特</div>
                        </div>
                        <div class="gallery-item">
                            <img src="img/8.jpg" alt="綠谷出久爆走" data-full="img/8.jpg">
                            <div class="caption">綠谷出久爆走</div>
                        </div>
                        <div class="gallery-item">
                            <img src="img/9.jpg" alt="綠谷出久普通" data-full="img/9.jpg">
                            <div class="caption">綠谷出久普通</div>
                        </div>
                        </div>
                </section>
           <div id="lightbox" class="lightbox">
                    <span class="close-btn">&times;</span>
                    <img class="lightbox-content" id="lightbox-img" src="" alt="">
                    <div id="lightbox-caption" class="lightbox-caption"></div>
                </div>
           
            <script>
                document.addEventListener('DOMContentLoaded', () => {
                    const galleryItems = document.querySelectorAll('.gallery-item img');
                    const lightbox = document.getElementById('lightbox');
                    const lightboxImg = document.getElementById('lightbox-img');
                    const lightboxCaption = document.getElementById('lightbox-caption');
                    const closeBtn = document.querySelector('.close-btn');
           
                    galleryItems.forEach(item => {
                        item.addEventListener('click', () => {
                            lightbox.style.display = 'flex';
                            lightboxImg.src = item.dataset.full; // 使用 data-full 屬性獲取大圖連結
                            lightboxCaption.innerHTML = item.alt;
                        });
                    });
           
                    closeBtn.addEventListener('click', () => {
                        lightbox.style.display = 'none';
                    });
           
                    // 點擊燈箱外部區域也關閉
                    lightbox.addEventListener('click', (e) => {
                        if (e.target === lightbox) {
                            lightbox.style.display = 'none';
                        }
                    });
           
                    // 鍵盤 ESC 關閉燈箱
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape' && lightbox.style.display === 'flex') {
                            lightbox.style.display = 'none';
                        }
                    });
                });
            </script>
    
          </main>
